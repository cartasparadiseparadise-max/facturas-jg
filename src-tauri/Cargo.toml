[package]
name = "facturas-jg-desktop"
version = "0.1.0"
description = "Facturas JG"
authors = ["Facturas JG"]
edition = "2021"

[lib]
name = "facturas_jg_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
